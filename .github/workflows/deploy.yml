# Builds and publishes the site.
#
# - Every day at 06:17 UTC (off the hour, when GitHub's scheduler is less
#   likely to delay or drop the run), so a post whose pubDate has arrived goes live
#   that morning without anyone running a deploy (see getPublishedPosts in
#   src/lib/posts.ts).
# - On demand from the Actions tab, or `gh workflow run deploy.yml`.
#
# Pushing to main does not deploy.
#
# AWS access is through the OIDC role defined in github-actions.tf.
name: Deploy

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

# Never run two deploys at once. A newer run waits for the current one.
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # required to request the OIDC token for AWS

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BUCKET: webkwizards.com
      DISTRIBUTION_ID: ETYX23IAQUFHZ
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::010526241219:role/webkwizards-github-deploy
          aws-region: us-east-1

      - run: ./deploy.sh
